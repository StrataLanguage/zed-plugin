id = "strata"
name = "Strata"
description = "Strata language support"
version = "0.1.1"
schema_version = 1
authors = ["Strata Contributors"]
repository = "https://github.com/StrataLanguage/zed-plugin"

# NOTE: The grammar lives in this same repository under
# `grammars/tree-sitter-strata` (see `path` below).
# After pushing this repo to GitHub, replace `repository` with the real URL
# and `rev` with a commit SHA that contains the grammar.
# For local iteration without pushing, temporarily use:
#   repository = "file:///ABSOLUTE/PATH/TO/strata-zed"
#   rev = "<local commit SHA>"
#   path = "grammars/tree-sitter-strata"
[grammars.strata]
repository = "https://github.com/StrataLanguage/zed-plugin"
rev = "e85e714aeba11cb5d36b99ebd34356ab40320005"
path = "grammars/tree-sitter-strata"

# The server binary is `strata-lsp`, built from the stratac repository. The languages list must match the
# `name` in languages/strata/config.toml.
[language_servers.strata-lsp]
name = "Strata LSP"
languages = ["Strata"]
