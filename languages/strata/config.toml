name = "Strata"
grammar = "strata"
path_suffixes = ["strata"]
line_comments = ["// "]
tab_size = 4
hard_tabs = false
autoclose_before = ",;:)]}"
word_characters = ["_"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
]

increase_indent_pattern = "\\{\\s*$"
decrease_indent_pattern = "^\\s*\\}"
